<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0A07"/>
      <stop offset="100%" style="stop-color:#1a1208"/>
    </linearGradient>
    <linearGradient id="taccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C17A3A"/>
      <stop offset="100%" style="stop-color:#e8932a"/>
    </linearGradient>
    <filter id="tglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#tbg)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="84" x2="800" y2="84" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0" y1="168" x2="800" y2="168" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0" y1="252" x2="800" y2="252" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0" y1="336" x2="800" y2="336" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="420" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="420" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="420" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="420" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Radial glow right side -->
  <ellipse cx="630" cy="210" rx="200" ry="180" fill="rgba(193,122,58,0.07)" filter="url(#tglow)"/>

  <!-- Browser / design tool window (right side) -->
  <rect x="450" y="72" width="300" height="240" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Browser top bar -->
  <rect x="450" y="72" width="300" height="28" rx="8" fill="rgba(255,255,255,0.06)"/>
  <rect x="450" y="86" width="300" height="14" fill="rgba(255,255,255,0.06)"/>
  <!-- Traffic light dots -->
  <circle cx="472" cy="86" r="5" fill="rgba(255,90,90,0.5)"/>
  <circle cx="489" cy="86" r="5" fill="rgba(255,190,50,0.5)"/>
  <circle cx="506" cy="86" r="5" fill="rgba(80,220,90,0.5)"/>
  <!-- URL bar -->
  <rect x="524" y="79" width="188" height="14" rx="4" fill="rgba(255,255,255,0.07)"/>
  <text x="618" y="90" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="middle">ezpz.coffee/design</text>

  <!-- Design tool content inside browser -->
  <!-- Bag outline shape -->
  <rect x="475" y="115" width="90" height="170" rx="6" fill="rgba(193,122,58,0.12)" stroke="rgba(193,122,58,0.35)" stroke-width="1.5"/>
  <rect x="475" y="115" width="90" height="20" rx="6" fill="rgba(193,122,58,0.2)"/>
  <rect x="475" y="275" width="90" height="12" rx="6" fill="rgba(193,122,58,0.18)"/>
  <!-- Logo placeholder inside bag -->
  <rect x="487" y="148" width="66" height="44" rx="3" fill="rgba(193,122,58,0.1)" stroke="rgba(193,122,58,0.2)" stroke-dasharray="4,3" stroke-width="1"/>
  <text x="520" y="173" font-family="Georgia, serif" font-size="8" fill="rgba(193,122,58,0.5)" text-anchor="middle">YOUR</text>
  <text x="520" y="183" font-family="Georgia, serif" font-size="8" fill="rgba(193,122,58,0.5)" text-anchor="middle">LOGO</text>
  <!-- Text lines on bag -->
  <rect x="487" y="202" width="66" height="4" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="495" y="212" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
  <rect x="499" y="220" width="42" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
  <!-- Valve -->
  <circle cx="548" cy="123" r="5" fill="rgba(193,122,58,0.4)" stroke="rgba(193,122,58,0.6)" stroke-width="1"/>
  <circle cx="548" cy="123" r="2.5" fill="rgba(193,122,58,0.8)"/>

  <!-- Right panel - controls -->
  <rect x="578" y="108" width="155" height="196" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Control label -->
  <text x="590" y="126" font-family="Georgia, serif" font-size="7.5" fill="rgba(255,255,255,0.25)" font-weight="700" letter-spacing="1.5">ORIGIN</text>
  <rect x="590" y="132" width="130" height="18" rx="3" fill="rgba(193,122,58,0.12)" stroke="rgba(193,122,58,0.25)" stroke-width="1"/>
  <text x="655" y="145" font-family="Georgia, serif" font-size="8.5" fill="rgba(255,255,255,0.6)" text-anchor="middle">Ethiopia — Light</text>

  <text x="590" y="170" font-family="Georgia, serif" font-size="7.5" fill="rgba(255,255,255,0.25)" font-weight="700" letter-spacing="1.5">ROAST</text>
  <rect x="590" y="176" width="130" height="18" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="655" y="189" font-family="Georgia, serif" font-size="8.5" fill="rgba(255,255,255,0.45)" text-anchor="middle">Medium</text>

  <text x="590" y="214" font-family="Georgia, serif" font-size="7.5" fill="rgba(255,255,255,0.25)" font-weight="700" letter-spacing="1.5">GRIND</text>
  <rect x="590" y="220" width="130" height="18" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="655" y="233" font-family="Georgia, serif" font-size="8.5" fill="rgba(255,255,255,0.45)" text-anchor="middle">Whole Bean</text>

  <!-- Order button -->
  <rect x="590" y="258" width="130" height="28" rx="3" fill="url(#taccent)"/>
  <text x="655" y="277" font-family="Georgia, serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700" letter-spacing="0.5">ORDER NOW</text>

  <!-- Quantity note -->
  <text x="655" y="298" font-family="Georgia, serif" font-size="7.5" fill="rgba(193,122,58,0.7)" text-anchor="middle">Zero minimum ✓</text>

  <!-- Upload cursor arrow (pointer) floating near logo area -->
  <polygon points="530,148 530,162 534,158 537,165 539,164 536,157 541,157" fill="rgba(255,255,255,0.6)" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>

  <!-- Accent top bar -->
  <rect x="0" y="0" width="800" height="4" fill="url(#taccent)"/>

  <!-- Text — left panel -->
  <text x="64" y="145" font-family="Georgia, serif" font-size="10.5" font-weight="700" fill="rgba(193,122,58,0.9)" letter-spacing="3">BEHIND THE BRAND</text>
  <rect x="64" y="154" width="38" height="2" fill="url(#taccent)" opacity="0.8"/>

  <text x="64" y="206" font-family="Georgia, serif" font-size="38" font-weight="900" fill="white" letter-spacing="-1">The Sticker</text>
  <text x="64" y="252" font-family="Georgia, serif" font-size="38" font-weight="900" fill="url(#taccent)" letter-spacing="-1">Mule of</text>
  <text x="64" y="298" font-family="Georgia, serif" font-size="38" font-weight="900" fill="white" letter-spacing="-1">Coffee.</text>

  <rect x="64" y="314" width="340" height="1.5" fill="rgba(255,255,255,0.06)"/>

  <text x="64" y="340" font-family="Georgia, serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="0.2">Design your bag online.</text>
  <text x="64" y="358" font-family="Georgia, serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="0.2">Zero minimum. No designer needed.</text>

  <!-- EZPZ badge -->
  <rect x="64" y="378" width="122" height="28" rx="3" fill="rgba(193,122,58,0.12)" stroke="rgba(193,122,58,0.35)" stroke-width="1"/>
  <text x="125" y="397" font-family="Georgia, serif" font-size="10" font-weight="700" fill="rgba(193,122,58,0.9)" text-anchor="middle" letter-spacing="1">BY EZPZ COFFEE</text>

  <!-- Corner accent right -->
  <rect x="760" y="0" width="40" height="420" fill="rgba(193,122,58,0.025)"/>
  <line x1="760" y1="0" x2="760" y2="420" stroke="rgba(193,122,58,0.08)" stroke-width="1"/>
</svg>
