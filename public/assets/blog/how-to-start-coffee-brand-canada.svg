<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070604"/>
      <stop offset="100%" style="stop-color:#0f0c08"/>
    </linearGradient>
    <linearGradient id="sacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c43e14"/>
      <stop offset="100%" style="stop-color:#e8521a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#sbg)"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="800" height="4" fill="url(#sacc)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="105" x2="800" y2="105" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="315" x2="800" y2="315" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="266" y1="0" x2="266" y2="420" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="533" y1="0" x2="533" y2="420" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>

  <!-- Right panel: 8 steps -->
  <rect x="470" y="24" width="290" height="372" rx="6" fill="rgba(255,255,255,0.022)" stroke="rgba(196,62,20,0.12)" stroke-width="1"/>

  <!-- Step rows -->
  <!-- Step 1 -->
  <text x="492" y="58" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.8)" letter-spacing="0.5">01</text>
  <text x="516" y="58" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.55)">Define your brand &amp; concept</text>
  <line x1="492" y1="66" x2="740" y2="66" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Step 2 -->
  <text x="492" y="88" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.8)" letter-spacing="0.5">02</text>
  <text x="516" y="88" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.55)">Choose your business model</text>
  <line x1="492" y1="96" x2="740" y2="96" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Step 3 -->
  <text x="492" y="118" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.9)" letter-spacing="0.5">03</text>
  <text x="516" y="118" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.65)">Find a private-label partner</text>
  <line x1="492" y1="126" x2="740" y2="126" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Step 4 -->
  <text x="492" y="148" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.9)" letter-spacing="0.5">04</text>
  <text x="516" y="148" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.65)">Select your coffee</text>
  <line x1="492" y1="156" x2="740" y2="156" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Step 5 -->
  <text x="492" y="178" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.9)" letter-spacing="0.5">05</text>
  <text x="516" y="178" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.65)">Design your packaging</text>
  <line x1="492" y1="186" x2="740" y2="186" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Step 6 -->
  <text x="492" y="208" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.8)" letter-spacing="0.5">06</text>
  <text x="516" y="208" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.55)">Set up your online store</text>
  <line x1="492" y1="216" x2="740" y2="216" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Step 7 -->
  <text x="492" y="238" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.8)" letter-spacing="0.5">07</text>
  <text x="516" y="238" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.55)">Price for profit</text>
  <line x1="492" y1="246" x2="740" y2="246" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Step 8 -->
  <text x="492" y="268" font-family="Georgia, serif" font-size="9" font-weight="700" fill="rgba(196,62,20,0.7)" letter-spacing="0.5">08</text>
  <text x="516" y="268" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.45)">Launch and market</text>
  <line x1="492" y1="276" x2="740" y2="276" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Divider + label -->
  <line x1="492" y1="300" x2="740" y2="300" stroke="rgba(196,62,20,0.12)" stroke-width="1"/>
  <text x="492" y="320" font-family="Georgia, serif" font-size="8" fill="rgba(196,62,20,0.5)" letter-spacing="1.5">8 STEPS TO LAUNCH</text>
  <text x="492" y="338" font-family="Georgia, serif" font-size="8" fill="rgba(255,255,255,0.25)" letter-spacing="0.5">No roasting. No inventory. No minimums.</text>

  <!-- Left text block -->
  <text x="72" y="132" font-family="Georgia, serif" font-size="11" font-weight="700" fill="rgba(196,62,20,0.9)" letter-spacing="3">GUIDES</text>
  <rect x="72" y="142" width="40" height="2" fill="url(#sacc)" opacity="0.8"/>

  <!-- Large ghost text -->
  <text x="50" y="272" font-family="Georgia, serif" font-size="120" font-weight="900" fill="rgba(196,62,20,0.055)" letter-spacing="-6">CB</text>

  <text x="72" y="206" font-family="Georgia, serif" font-size="28" font-weight="900" fill="white" letter-spacing="-0.5">How to Start</text>
  <text x="72" y="240" font-family="Georgia, serif" font-size="28" font-weight="900" fill="url(#sacc)" letter-spacing="-0.5">a Coffee Brand</text>
  <text x="72" y="274" font-family="Georgia, serif" font-size="28" font-weight="900" fill="white" letter-spacing="-0.5">in Canada</text>

  <rect x="72" y="288" width="360" height="1.5" fill="rgba(255,255,255,0.06)"/>

  <text x="72" y="314" font-family="Georgia, serif" font-size="12" fill="rgba(255,255,255,0.38)" letter-spacing="0.2">The complete 2026 guide.</text>
  <text x="72" y="331" font-family="Georgia, serif" font-size="12" fill="rgba(255,255,255,0.38)" letter-spacing="0.2">Zero inventory · Zero minimum</text>

  <!-- EZPZ badge -->
  <rect x="72" y="362" width="108" height="26" rx="3" fill="rgba(196,62,20,0.14)" stroke="rgba(196,62,20,0.38)" stroke-width="1"/>
  <text x="126" y="380" font-family="Georgia, serif" font-size="10" font-weight="700" fill="rgba(196,62,20,0.88)" text-anchor="middle" letter-spacing="1">BY EZPZ COFFEE</text>

  <!-- Right edge accent -->
  <rect x="758" y="0" width="42" height="420" fill="rgba(196,62,20,0.025)"/>
  <line x1="758" y1="0" x2="758" y2="420" stroke="rgba(196,62,20,0.08)" stroke-width="1"/>
</svg>
