<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="wbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080503"/>
      <stop offset="100%" style="stop-color:#110c07"/>
    </linearGradient>
    <linearGradient id="wacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c43e14"/>
      <stop offset="100%" style="stop-color:#e8521a"/>
    </linearGradient>
    <linearGradient id="wbag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c0f07"/>
      <stop offset="100%" style="stop-color:#0d0804"/>
    </linearGradient>
    <filter id="wglow">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#wbg)"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="800" height="4" fill="url(#wacc)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="105" x2="800" y2="105" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="315" x2="800" y2="315" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="420" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>

  <!-- Left panel: text composition -->
  <text x="52" y="88" font-family="Georgia, serif" font-size="9" font-weight="800" fill="rgba(196,62,20,0.9)" letter-spacing="2.8">WHOLESALE</text>
  <line x1="52" y1="96" x2="180" y2="96" stroke="rgba(196,62,20,0.3)" stroke-width="1"/>

  <text x="52" y="138" font-family="Georgia, serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.92)">Wholesale</text>
  <text x="52" y="170" font-family="Georgia, serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.92)">Coffee Beans</text>
  <text x="52" y="202" font-family="Georgia, serif" font-size="28" font-weight="900" fill="rgba(196,62,20,0.85)">for Your Business</text>

  <text x="52" y="238" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="0.3">The Canadian Guide</text>

  <line x1="52" y1="258" x2="340" y2="258" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Key points -->
  <circle cx="62" cy="280" r="3" fill="rgba(196,62,20,0.7)"/>
  <text x="74" y="284" font-family="Georgia, serif" font-size="9.5" fill="rgba(255,255,255,0.45)">Specialty-grade beans, roasted fresh in Montreal</text>

  <circle cx="62" cy="304" r="3" fill="rgba(196,62,20,0.7)"/>
  <text x="74" y="308" font-family="Georgia, serif" font-size="9.5" fill="rgba(255,255,255,0.45)">Consistent supply on your schedule</text>

  <circle cx="62" cy="328" r="3" fill="rgba(196,62,20,0.7)"/>
  <text x="74" y="332" font-family="Georgia, serif" font-size="9.5" fill="rgba(255,255,255,0.45)">Restaurants, cafés, hotels, offices</text>

  <text x="52" y="382" font-family="Georgia, serif" font-size="8" fill="rgba(255,255,255,0.18)" letter-spacing="1">EZPZ COFFEE · MONTRÉAL</text>

  <!-- Right panel: wholesale bag illustration -->
  <!-- Glow behind bags -->
  <ellipse cx="610" cy="210" rx="110" ry="120" fill="rgba(196,62,20,0.07)" filter="url(#wglow)"/>

  <!-- Back bag (shadow) -->
  <rect x="565" y="100" width="110" height="195" rx="8" fill="rgba(0,0,0,0.35)"/>

  <!-- Center main bag -->
  <rect x="530" y="85" width="130" height="220" rx="8" fill="url(#wbag)" stroke="rgba(196,62,20,0.28)" stroke-width="1.5"/>
  <!-- Bag top seal/clip -->
  <rect x="544" y="85" width="102" height="22" rx="4" fill="rgba(196,62,20,0.25)" stroke="rgba(196,62,20,0.3)" stroke-width="1"/>
  <line x1="544" y1="96" x2="646" y2="96" stroke="rgba(196,62,20,0.2)" stroke-width="1"/>
  <!-- Bag label area -->
  <rect x="544" y="120" width="102" height="150" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Label accent bar -->
  <rect x="544" y="120" width="102" height="4" rx="1" fill="url(#wacc)" opacity="0.8"/>
  <!-- Label text -->
  <text x="595" y="158" font-family="Georgia, serif" font-size="7.5" font-weight="800" fill="rgba(196,62,20,0.85)" text-anchor="middle" letter-spacing="2">EN GROS</text>
  <text x="595" y="175" font-family="Georgia, serif" font-size="18" font-weight="900" fill="rgba(255,255,255,0.85)" text-anchor="middle">EZPZ</text>
  <text x="595" y="190" font-family="Georgia, serif" font-size="7" font-weight="600" fill="rgba(255,255,255,0.28)" text-anchor="middle" letter-spacing="1.5">WHOLESALE</text>
  <line x1="558" y1="200" x2="632" y2="200" stroke="rgba(196,62,20,0.15)" stroke-width="1"/>
  <text x="595" y="216" font-family="Georgia, serif" font-size="7" fill="rgba(255,255,255,0.2)" text-anchor="middle">SPECIALTY GRADE · 80+ SCA</text>
  <text x="595" y="230" font-family="Georgia, serif" font-size="7" fill="rgba(255,255,255,0.2)" text-anchor="middle">ROASTED FRESH · MONTREAL</text>
  <!-- Valve -->
  <circle cx="595" cy="252" r="7" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="595" cy="252" r="3" fill="rgba(196,62,20,0.2)"/>
  <!-- Bag bottom gusset -->
  <ellipse cx="595" cy="305" rx="50" ry="8" fill="rgba(196,62,20,0.1)" stroke="rgba(196,62,20,0.15)" stroke-width="1"/>

  <!-- Second bag leaning right -->
  <rect x="670" y="130" width="100" height="180" rx="7" fill="rgba(20,12,7,0.85)" stroke="rgba(196,62,20,0.15)" stroke-width="1" transform="rotate(6, 720, 220)"/>
  <rect x="670" y="130" width="100" height="17" rx="3" fill="rgba(196,62,20,0.15)" transform="rotate(6, 720, 220)"/>

  <!-- Third bag leaning left -->
  <rect x="430" y="140" width="95" height="170" rx="7" fill="rgba(18,10,5,0.8)" stroke="rgba(196,62,20,0.12)" stroke-width="1" transform="rotate(-5, 477, 225)"/>
  <rect x="430" y="140" width="95" height="17" rx="3" fill="rgba(196,62,20,0.12)" transform="rotate(-5, 477, 225)"/>

  <!-- Scattered coffee beans -->
  <!-- Bean: oval + center line -->
  <g opacity="0.35">
    <ellipse cx="470" cy="370" rx="9" ry="6" fill="rgba(196,62,20,0.6)" transform="rotate(-20, 470, 370)"/>
    <line x1="461" y1="370" x2="479" y2="370" stroke="rgba(0,0,0,0.4)" stroke-width="1" transform="rotate(-20, 470, 370)"/>
  </g>
  <g opacity="0.3">
    <ellipse cx="500" cy="58" rx="7" ry="5" fill="rgba(196,62,20,0.5)" transform="rotate(30, 500, 58)"/>
    <line x1="493" y1="58" x2="507" y2="58" stroke="rgba(0,0,0,0.4)" stroke-width="1" transform="rotate(30, 500, 58)"/>
  </g>
  <g opacity="0.25">
    <ellipse cx="750" cy="380" rx="8" ry="5.5" fill="rgba(196,62,20,0.5)" transform="rotate(-10, 750, 380)"/>
    <line x1="742" y1="380" x2="758" y2="380" stroke="rgba(0,0,0,0.35)" stroke-width="1" transform="rotate(-10, 750, 380)"/>
  </g>
  <g opacity="0.2">
    <ellipse cx="415" cy="90" rx="6" ry="4.5" fill="rgba(196,62,20,0.5)" transform="rotate(15, 415, 90)"/>
    <line x1="409" y1="90" x2="421" y2="90" stroke="rgba(0,0,0,0.3)" stroke-width="1" transform="rotate(15, 415, 90)"/>
  </g>
  <g opacity="0.2">
    <ellipse cx="770" cy="70" rx="7" ry="5" fill="rgba(196,62,20,0.45)"/>
    <line x1="763" y1="70" x2="777" y2="70" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  </g>

  <!-- Quantity label -->
  <rect x="440" y="340" width="90" height="30" rx="4" fill="rgba(196,62,20,0.12)" stroke="rgba(196,62,20,0.25)" stroke-width="1"/>
  <text x="485" y="360" font-family="Georgia, serif" font-size="8" font-weight="800" fill="rgba(196,62,20,0.75)" text-anchor="middle" letter-spacing="1.5">BULK SUPPLY</text>
</svg>
