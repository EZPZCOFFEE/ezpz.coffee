<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060809"/>
      <stop offset="100%" style="stop-color:#0e0c0a"/>
    </linearGradient>
    <linearGradient id="dacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c43e14"/>
      <stop offset="100%" style="stop-color:#e8521a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#dbg)"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="800" height="4" fill="url(#dacc)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="105" x2="800" y2="105" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="315" x2="800" y2="315" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="266" y1="0" x2="266" y2="420" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="533" y1="0" x2="533" y2="420" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>

  <!-- Right panel: flow diagram -->
  <rect x="470" y="24" width="290" height="372" rx="6" fill="rgba(255,255,255,0.022)" stroke="rgba(196,62,20,0.12)" stroke-width="1"/>

  <!-- Flow step 1 -->
  <rect x="492" y="44" width="246" height="52" rx="4" fill="rgba(196,62,20,0.1)" stroke="rgba(196,62,20,0.3)" stroke-width="1"/>
  <text x="615" y="65" font-family="Georgia, serif" font-size="8" font-weight="700" fill="rgba(196,62,20,0.9)" text-anchor="middle" letter-spacing="1.5">YOUR CUSTOMER ORDERS</text>
  <text x="615" y="82" font-family="Georgia, serif" font-size="8" fill="rgba(255,255,255,0.38)" text-anchor="middle">on your Shopify store</text>

  <!-- Arrow -->
  <line x1="615" y1="96" x2="615" y2="112" stroke="rgba(196,62,20,0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="610,110 620,110 615,117" fill="rgba(196,62,20,0.5)"/>

  <!-- Flow step 2 -->
  <rect x="492" y="118" width="246" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="615" y="139" font-family="Georgia, serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">EZPZ ROASTS &amp; PACKS</text>
  <text x="615" y="156" font-family="Georgia, serif" font-size="8" fill="rgba(255,255,255,0.38)" text-anchor="middle">fresh in Montreal</text>

  <!-- Arrow -->
  <line x1="615" y1="170" x2="615" y2="186" stroke="rgba(196,62,20,0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="610,184 620,184 615,191" fill="rgba(196,62,20,0.5)"/>

  <!-- Flow step 3 -->
  <rect x="492" y="192" width="246" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="615" y="213" font-family="Georgia, serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">SHIPS UNDER YOUR BRAND</text>
  <text x="615" y="230" font-family="Georgia, serif" font-size="8" fill="rgba(255,255,255,0.38)" text-anchor="middle">direct to your customer</text>

  <!-- Arrow -->
  <line x1="615" y1="244" x2="615" y2="260" stroke="rgba(196,62,20,0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="610,258 620,258 615,265" fill="rgba(196,62,20,0.5)"/>

  <!-- Flow step 4 -->
  <rect x="492" y="266" width="246" height="52" rx="4" fill="rgba(196,62,20,0.07)" stroke="rgba(196,62,20,0.2)" stroke-width="1"/>
  <text x="615" y="287" font-family="Georgia, serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">YOU KEEP THE MARGIN</text>
  <text x="615" y="304" font-family="Georgia, serif" font-size="8" fill="rgba(255,255,255,0.38)" text-anchor="middle">zero inventory touched</text>

  <!-- Label at bottom of panel -->
  <text x="615" y="352" font-family="Georgia, serif" font-size="8" fill="rgba(196,62,20,0.5)" text-anchor="middle" letter-spacing="1.5">ZERO INVENTORY MODEL</text>

  <!-- Left text block -->
  <text x="72" y="132" font-family="Georgia, serif" font-size="11" font-weight="700" fill="rgba(196,62,20,0.9)" letter-spacing="3">GUIDES</text>
  <rect x="72" y="142" width="40" height="2" fill="url(#dacc)" opacity="0.8"/>

  <!-- Large ghost text -->
  <text x="55" y="268" font-family="Georgia, serif" font-size="120" font-weight="900" fill="rgba(196,62,20,0.055)" letter-spacing="-6">DS</text>

  <text x="72" y="206" font-family="Georgia, serif" font-size="30" font-weight="900" fill="white" letter-spacing="-0.5">Coffee</text>
  <text x="72" y="242" font-family="Georgia, serif" font-size="30" font-weight="900" fill="url(#dacc)" letter-spacing="-0.5">Dropshipping</text>
  <text x="72" y="278" font-family="Georgia, serif" font-size="30" font-weight="900" fill="white" letter-spacing="-0.5">in Canada</text>

  <rect x="72" y="292" width="360" height="1.5" fill="rgba(255,255,255,0.06)"/>

  <text x="72" y="318" font-family="Georgia, serif" font-size="12" fill="rgba(255,255,255,0.38)" letter-spacing="0.2">How it works, step by step.</text>
  <text x="72" y="335" font-family="Georgia, serif" font-size="12" fill="rgba(255,255,255,0.38)" letter-spacing="0.2">Canada · 2026</text>

  <!-- EZPZ badge -->
  <rect x="72" y="362" width="108" height="26" rx="3" fill="rgba(196,62,20,0.14)" stroke="rgba(196,62,20,0.38)" stroke-width="1"/>
  <text x="126" y="380" font-family="Georgia, serif" font-size="10" font-weight="700" fill="rgba(196,62,20,0.88)" text-anchor="middle" letter-spacing="1">BY EZPZ COFFEE</text>

  <!-- Right edge accent -->
  <rect x="758" y="0" width="42" height="420" fill="rgba(196,62,20,0.025)"/>
  <line x1="758" y1="0" x2="758" y2="420" stroke="rgba(196,62,20,0.08)" stroke-width="1"/>
</svg>
